<!DOCTYPE html>
<html>
<head>
  <title>Spring Boot Redis Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
  <h3>Redis Chat</h3>
  <input id="to" placeholder="Send to (username)">
  <input id="msg" placeholder="Message">
  <button onclick="sendMessage()">Send</button>
  <div id="connection-status">Connecting...</div>
  <ul id="messages"></ul>

  <script>
    let stompClient = null;
    let isConnected = false;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;
    const RECONNECT_DELAY = 5000; // 5 seconds
    const username = prompt("Enter your username:");
    
    function updateConnectionStatus(status, isError = false) {
        const statusDiv = document.getElementById('connection-status');
        statusDiv.textContent = status;
        statusDiv.style.color = isError ? 'red' : 'green';
    }

    function connect() {
        console.log('Attempting to connect to WebSocket...');
        updateConnectionStatus('Connecting...');
        
        try {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = (str) => {
                console.log('STOMP: ' + str);
            };
            
            stompClient.connect({}, 
                (frame) => {
                    console.log('Connected: ' + frame);
                    isConnected = true;
                    reconnectAttempts = 0;
                    updateConnectionStatus('Connected');
                    onConnected();
                },
                (error) => {
                    console.error('STOMP error: ' + error);
                    isConnected = false;
                    updateConnectionStatus('Connection failed', true);
                    onError(error);
                }
            );
        } catch (error) {
            console.error('Error creating WebSocket connection:', error);
            updateConnectionStatus('Connection error', true);
            onError(error);
        }
    }

    function onConnected() {
        console.log('WebSocket connection established');
        fetch(`/online/${username}`, { method: 'POST' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to mark user as online');
                }
                console.log('User marked as online');
            })
            .catch(error => {
                console.error('Error marking user as online:', error);
                updateConnectionStatus('Error marking user as online', true);
            });
        
        try {
            stompClient.subscribe(`/topic/${username}`, onMessageReceived);
            console.log('Subscribed to /topic/' + username);
        } catch (error) {
            console.error('Error subscribing to topic:', error);
            updateConnectionStatus('Subscription error', true);
        }
    }

    function onError(error) {
        console.error('Error connecting to WebSocket:', error);
        isConnected = false;
        
        if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
            reconnectAttempts++;
            console.log(`Attempting to reconnect (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`);
            updateConnectionStatus(`Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
            setTimeout(connect, RECONNECT_DELAY);
        } else {
            console.error('Max reconnection attempts reached');
            updateConnectionStatus('Connection failed. Please refresh the page.', true);
        }
    }

    function onMessageReceived(payload) {
        console.log('Message received:', payload);
        try {
            const message = JSON.parse(payload.body);
            const li = document.createElement('li');
            li.textContent = `${message.from}: ${message.message}`;
            document.getElementById('messages').appendChild(li);
        } catch (error) {
            console.error('Error processing received message:', error);
        }
    }

    function sendMessage() {
        if (!isConnected) {
            console.error('WebSocket is not connected');
            updateConnectionStatus('Not connected. Attempting to reconnect...', true);
            connect();
            return;
        }

        const to = document.getElementById('to').value;
        const message = document.getElementById('msg').value;

        if (!to || !message) {
            alert('Please enter both recipient and message');
            return;
        }

        const chatMessage = {
            from: username,
            to: to,
            message: message
        };
        
        console.log('Sending message:', chatMessage);
        try {
            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
            document.getElementById('msg').value = '';
        } catch (error) {
            console.error('Error sending message:', error);
            updateConnectionStatus('Error sending message', true);
            alert('Failed to send message. Please try again.');
        }
    }

    window.onbeforeunload = () => {
        if (isConnected) {
            fetch(`/online/${username}`, { method: 'DELETE' })
                .then(response => {
                    if (!response.ok) {
                        console.error('Failed to mark user as offline');
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    };

    // Connect to WebSocket when page loads
    connect();
  </script>
</body>
</html>
